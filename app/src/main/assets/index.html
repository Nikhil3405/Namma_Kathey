    color: white;

<script>
    function onDistrictClick(name) {
        if (window.Android) {
            window.Android.onDistrictClicked(name);
        }
    }

    // 🔥 Called from Kotlin
    function highlightDistrict(districtName, color) {
        const el = document.getElementById(districtName);
        if (el) {
            el.style.fill = color;
        }
    }
</script>
<script>
const districtNames = {
      "Bengaluru Urban": "Bengaluru Urban",
      "chikballapura": "Chikballapura",
      "kolar": "Kolar",
      "tumkur": "Tumkur",
      "Vijayanagara": "Vijayanagara",
      "Kodagu": "Kodagu",
      "Udupi": "Udupi",
      "Shivamogga": "Shivamogga",
      "Kalaburagi": "Kalaburagi",
      "Bidar": "Bidar",
      "Bengaluru Rural": "Bengaluru Rural",
      "Chamarajanagar": "Chamarajanagar",
      "Belagavi": "Belagavi",
      "Haveri": "Haveri",
      "Chitradurga": "Chitradurga",
      "Raichur": "Raichur",
      "Koppal": "Koppal",
      "Dharwad": "Dharwad",
      "Gadag": "Gadag",
      "Bagalkot": "Bagalkot",
      "Bijapur": "Bijapur",
      "Yadgir": "Yadgir",
      "Davangere": "Davangere",
      "Chikkamagaluru": "Chikkamagaluru",
      "Mysuru": "Mysuru",
      "Hassan": "Hassan",
      "Uttara Kannada": "Uttara Kannada",
      "Dakshina Kannada": "Dakshina Kannada",
      "Ramnagara": "Ramnagara",
      "Mandya": "Mandya",
      "Ballari": "Ballari",

};

const labelOffsets = {
    "Bengaluru Rural": { dx: 0, dy: -5 },
    "Bengaluru Urban": { dx: -1, dy: 0 },
    "Davangere":{dx: -3, dy: 0},
};

const svg = document.querySelector("svg");

document.querySelectorAll("svg path").forEach(el => {
    const id = el.id;
    if (!id) return;

    const name = districtNames[id] || id;

    // ✅ Click
    el.addEventListener("click", () => {
        if (window.Android) {
            window.Android.onDistrictClicked(name);
        } else {
            alert(name);
        }
    });

    // ✅ FIX: get bbox FIRST
    const bbox = el.getBBox();

    let centerX = bbox.x + bbox.width / 2;
    let centerY = bbox.y + bbox.height / 2;

    // ✅ Apply offset
    if (labelOffsets[id]) {
        centerX += labelOffsets[id].dx;
        centerY += labelOffsets[id].dy;
    }

    // ✅ Label
    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");

    text.setAttribute("x", centerX);
    text.setAttribute("y", centerY);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("dominant-baseline", "middle");
    text.setAttribute("font-size", "4");
    text.setAttribute("font-weight", "bold");

    // 🔥 Better visibility
    text.setAttribute("fill", "#000");

    text.setAttribute("pointer-events", "none");
    text.textContent = name;

    svg.appendChild(text);
});

// Highlight
function highlightDistrict(districtId, color) {
    const el = document.getElementById(districtId);
    if (el) el.style.fill = color;
}
</script>
